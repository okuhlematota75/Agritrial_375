<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriTrial MVP</title>
  <style>
    body {
      margin: 0;
      background-color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .login-box {width: 300px;
      margin: 80px auto;
      border: 2px solid #2e5e3a;
      border-radius: 3px;
      padding: 30px;
      text-align: center;}

    h1 {
      margin: 0;
      color: #2e5e3a;
      font-size: 22px;
    }

    .version {
      margin: 5px 0 25px 0;
      color: #555555;
      font-size: 14px;
    }

    .fieldLabel {
      display: block;
      text-align: left;
      margin-bottom: 5px;
      color: #333333;
      font-size: 14px;
    }

    .box {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 2px solid #2e5e3a;
      border-radius: 3px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .toggleRow {
      text-align: left;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 3px;
      background-color: #2e5e3a;
      color: #ffffff;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background-color: #20472a;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>AgriTrial MVP</h1>
    <p class="version">Vers.1</p>
    <label class="fieldLabel" for="username">Username</label>
    <input class="box" type="text" id="username">
    <label class="fieldLabel" for="password">Password</label>
    <input class="box" type="password" id="password">

    <div class="toggleRow">
      <input type="checkbox" id="togglePassword" onchange="toggleShowPassword()">
      <label for="togglePassword">Show Password</label>
    </div>

    <button id="loginBtn">Log in</button>
  </div>

  <script>
    function toggleShowPassword() {
      var passwordInput = document.getElementById("password");
      var checkbox = document.getElementById("togglePassword");
      if (checkbox.checked) {
        passwordInput.type = "text";
      } else {
        passwordInput.type = "password";
      }
    }
    document.getElementById("loginBtn").addEventListener("click", async (e) => {
    e.preventDefault();

    try {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

    const response = await fetch("http://localhost:5000/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    const result = await response.json();

    if (response.ok) {
      window.location.href = "central_dashboard.html"; 
    } else {
      alert(result.error || "Login failed");
    }
  } catch (error) {
    console.error("Error during login:", error);
    alert("An error occurred during login. Please try again.");
  }
    });
  </script>
  
  </body>
</html>
